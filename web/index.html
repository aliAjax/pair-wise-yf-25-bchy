<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学术会议同行评审</title>
<style>body{font:16px system-ui;max-width:900px;margin:32px auto;padding:0 16px}input,textarea,select,button{font:inherit;padding:8px;margin:4px}textarea{width:100%;height:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid #bbb;padding:16px;border-radius:8px}pre{white-space:pre-wrap;background:#f4f4f4;padding:12px}</style></head>
<body><h1>学术会议同行评审</h1><p>选择身份后，页面会通过 <code>X-User-Id</code> 调用 JSON API。演示账号：alice、bob、r1、r2、r3、r4、chair。</p>
<div class="grid"><section class="panel"><h2>提交论文</h2><select id="user"><option>alice</option><option>bob</option><option>r1</option><option>r2</option><option>r3</option><option>r4</option><option>chair</option></select><input id="title" placeholder="标题"><textarea id="abstract" placeholder="摘要（至少20字）"></textarea><button onclick="submitPaper()">提交</button></section>
<section class="panel"><h2>查看论文</h2><button onclick="loadPapers()">刷新当前身份可见论文</button><pre id="papers"></pre></section></div>
<div class="grid"><section class="panel"><h2>申请复核（作者）</h2><input id="rcPaper" placeholder="论文ID"><textarea id="rcReason" placeholder="复核说明（至少10字）"></textarea><button onclick="requestReconsideration()">提交复核申请</button></section>
<section class="panel"><h2>受理复核（主席）</h2><input id="rcChairPaper" placeholder="论文ID"><label><input type="radio" name="rcAccepted" value="1" checked>接受</label><label><input type="radio" name="rcAccepted" value="0">驳回</label><button onclick="respondReconsideration()">提交受理结果</button></section></div>
<script>
const headers={"Content-Type":"application/json","X-User-Id":document.querySelector("#user").value};
document.querySelector("#user").onchange=e=>headers["X-User-Id"]=e.target.value;
async function api(url,opt={}){const r=await fetch(url,{...opt,headers});return await r.json()}
async function submitPaper(){const p=await api("/api/papers",{method:"POST",body:JSON.stringify({title:title.value,abstract:abstract.value})});alert(JSON.stringify(p,null,2))}
async function loadPapers(){papers.textContent=JSON.stringify(await api("/api/papers"),null,2)}
async function requestReconsideration(){const p=await api(`/api/papers/${rcPaper.value}/reconsideration`,{method:"POST",body:JSON.stringify({reason:rcReason.value})});alert(JSON.stringify(p,null,2))}
async function respondReconsideration(){const accepted=document.querySelector("input[name=rcAccepted]:checked").value==="1";const p=await api(`/api/papers/${rcChairPaper.value}/reconsideration`,{method:"POST",body:JSON.stringify({action:"respond",accepted})});alert(JSON.stringify(p,null,2))}
</script></body></html>
